# Version updates wait 14 days after a release (a hijacked release is usually pulled within
# days) and open against develop, where work lands. Security updates ignore both settings:
# they open against main at once, and are retargeted to develop to ship with the next release.
# This file is read from main, so a change here takes effect with the release that carries it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/compose", "/compose/sshd"]
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
  # The test and demo stacks name images in compose files, which the docker ecosystem skips
  - package-ecosystem: docker-compose
    directories: ["/compose", "/docs/screenshots/demo"]
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      compose-images:
        patterns: ["*"]
