# Version updates wait 14 days after a release (a hijacked release is usually pulled within
# days); security updates are not subject to the cooldown
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/compose", "/compose/sshd"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
