name: Release

# Image tags follow the branches: `develop` tracks the develop branch, `latest` tracks main,
# and a `vX.Y` tag publishes X.Y and X and refreshes the Docker Hub overview.
# The weekly run rebuilds main from scratch and republishes `latest`, X.Y and X, so base image
# and Alpine package fixes reach the released image without a code change.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_DOCKERHUB: eduonieva/remotebackups
  IMAGE_GHCR: ghcr.io/eduonieva/remotebackups

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: the package version, which a git tag must match
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          # Versions have two parts (v2.1), which is not semver, so the numbered tags are matches
          tags: |
            type=match,pattern=v(\d+\.\d+),group=1
            type=match,pattern=v(\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # main is the last release, so the weekly rebuild refreshes its numbered tags too
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=remotebackups
            org.opencontainers.image.description=Scheduled rsync backups of home-server folders to another host, with a web UI
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # A rebuild for base-image fixes must not reuse last week's apk layer
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Needs a Docker Hub token with read, write and delete scope; a read/write one gets a 403.
      # The image is already published by then, so a failure here never fails the release.
      - name: Docker Hub overview from the README
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_DOCKERHUB }}
          short-description: Scheduled rsync backups of home-server folders to another host, with a web UI
          readme-filepath: ./README.md
