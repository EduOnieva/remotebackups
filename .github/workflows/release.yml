name: Release

# Image tags follow the branches: `develop` tracks the develop branch, `latest` tracks main,
# and a `vX.Y` tag publishes X.Y and X and refreshes the Docker Hub overview.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_DOCKERHUB: eduonieva/remotebackups
  IMAGE_GHCR: ghcr.io/eduonieva/remotebackups

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the git tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          # Versions have two parts (v2.1), which is not semver, so the numbered tags are matches
          tags: |
            type=match,pattern=v(\d+\.\d+),group=1
            type=match,pattern=v(\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=remotebackups
            org.opencontainers.image.description=Scheduled rsync backups of home-server folders to another host, with a web UI
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Needs a Docker Hub token with read, write and delete scope; a read/write one gets a 403.
      # The image is already published by then, so a failure here never fails the release.
      - name: Docker Hub overview from the README
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_DOCKERHUB }}
          short-description: Scheduled rsync backups of home-server folders to another host, with a web UI
          readme-filepath: ./README.md
