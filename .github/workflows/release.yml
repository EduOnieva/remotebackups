name: Release

# Image tags follow the branches: `develop` tracks the develop branch, `latest` tracks main,
# and a `vX.Y` tag publishes X.Y and X and refreshes the Docker Hub overview.
# The weekly run rebuilds main and republishes `latest`, X.Y and X, so Alpine's package fixes
# reach the released image without a code change; it then scans what it published.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Nothing by default: the job below states what it needs
permissions: {}

# Two pushes in quick succession must publish in order, not race for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_DOCKERHUB: eduonieva/remotebackups
  IMAGE_GHCR: ghcr.io/eduonieva/remotebackups

jobs:
  publish:
    name: test, publish, scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
      packages: write # push the image to GHCR
    steps:
      # persist-credentials: no step pushes with git, so the token is not left in .git/config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        name: the package version, which a git tag must match
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is pushed before it is tested: this is the amd64 image of the push below, built
      # without the layer cache so `apk upgrade` takes the Alpine packages of the day
      - name: build the candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: remotebackups:candidate
          no-cache: true
      # BUILDX_BUILDER: the stack's own images are built by the engine, as in the CI workflow
      - name: integration stack against the candidate
        run: |
          docker run --rm --entrypoint sh remotebackups:candidate -c 'remotebackups --version; rsync --version | head -1; ssh -V'
          BUILDX_BUILDER=default APP_IMAGE=remotebackups:candidate TEST_BUILD="sshd tests" make test-integration

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          # Versions have two parts (v2.1), which is not semver, so the numbered tags are matches
          tags: |
            type=match,pattern=v(\d+\.\d+),group=1
            type=match,pattern=v(\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # main is the last release, so the weekly rebuild refreshes its numbered tags too
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=remotebackups
            org.opencontainers.image.description=Scheduled rsync backups of home-server folders to another host, with a web UI
            org.opencontainers.image.licenses=MIT

      # amd64 comes from this job's builder cache, so what is pushed is the candidate just
      # tested; the builder started empty, so arm64 is built from scratch here as well
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Needs a Docker Hub token with read, write and delete scope; a read/write one gets a 403.
      # The image is already published by then, so a failure here never fails the release.
      - name: Docker Hub overview from the README
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_DOCKERHUB }}
          short-description: Scheduled rsync backups of home-server folders to another host, with a web UI
          readme-filepath: ./README.md

      # After the push on purpose: the rebuilt image is the best there is, so a finding must
      # not hold it back. Any severity counts, since scanners disagree on it; what matters is
      # that a fix exists and the image lacks it. The failed run is the weekly notice of that
      - name: scan the weekly image for vulnerabilities that have a fix
        if: github.event_name != 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remotebackups:candidate
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
