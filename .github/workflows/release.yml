name: Release

# Pushes to main publish the `develop` tag; a `vX.Y.Z` tag publishes X.Y.Z, X.Y, X and latest.
# The v2 branch is included until the rewrite is merged, so it can be tried on a server first.
on:
  push:
    branches: [main, v2]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_DOCKERHUB: eduonieva/remotebackups
  IMAGE_GHCR: ghcr.io/eduonieva/remotebackups

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the git tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=remotebackups
            org.opencontainers.image.description=Scheduled rsync backups of home-server folders to another host, with a web UI
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
