name: CI

on:
  push:
    branches: [main, develop, wip]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    # 3.14 is tracked for wheel readiness only; 3.13 is what the image ships
    continue-on-error: ${{ matrix.python == '3.14' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make lock-check
      - run: make lint
      - run: make type
      - run: make test

  image:
    name: build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: remotebackups:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run --rm remotebackups:ci --version
          docker run --rm -e REMOTE_HOST=example -e REMOTE_USER=backup remotebackups:ci check-config
          docker run --rm --entrypoint sh remotebackups:ci -c 'rsync --version | head -1 && ssh -V && sshpass -V | head -1'
      # The integration job tests this very image instead of building its own
      - run: docker save remotebackups:ci -o /tmp/remotebackups-ci.tar
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image
          path: /tmp/remotebackups-ci.tar
          retention-days: 1

  integration:
    name: integration stack
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/remotebackups-ci.tar
      - run: APP_IMAGE=remotebackups:ci TEST_BUILD="sshd tests" make test-integration

  arm64-smoke:
    name: arm64 build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: remotebackups:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --platform linux/arm64 remotebackups:ci-arm64 --version
