name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    # 3.14 is tracked for wheel readiness only; 3.13 is what the image ships
    continue-on-error: ${{ matrix.python == '3.14' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make lock-check
      - run: make lint
      - run: make type
      - run: make test

  image:
    name: build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: remotebackups:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run --rm remotebackups:ci --version
          docker run --rm -e REMOTE_HOST=example -e REMOTE_USER=backup remotebackups:ci check-config
          docker run --rm --entrypoint sh remotebackups:ci -c 'rsync --version | head -1 && ssh -V && sshpass -V | head -1'

  integration:
    name: integration stack
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: make test-integration

  arm64-smoke:
    name: arm64 build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: remotebackups:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --platform linux/arm64 remotebackups:ci-arm64 --version
