services:
  tailscale: 
    container_name: tailscale-backup
    hostname: your-hostname
    image: tailscale/tailscale:stable 
    ports:
      - "2222:80"
    environment:
      - TS_AUTHKEY=your_tailscale_auth_key_here
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes: 
      - ./config/tailscale/state:/var/lib/tailscale
      - ./config/tailscale/config:/config
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    networks:
      backup:
        ipv4_address: 192.168.6.10
    labels:
      - com.centurylinklabs.watchtower.enable=false
  
  rsync-backup:
    container_name: rsync-backup
    build:
      context: .
      dockerfile: build/Dockerfile
      target: production
    volumes:
      - ./config:/config
      - ~/.ssh:/mnt/ssh_keys:ro
      - /path/to/your/data1:/data/source1
      - /path/to/your/data2:/data/source2
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - REMOTE_USER=your_remote_username
      - REMOTE_HOST=100.x.x.x  # Your Tailscale IP
      - TRUENAS_DISABLED=false  # true if the remote is not a TrueNAS: /api/pool_status becomes rsync-only and REMOTE_API_TOKEN is unused
      - REMOTE_API_TOKEN=your_truenas_api_key_here
      - TRUENAS_POOL_ALIASES=  # Optional: rename pools in /api/pool_status, e.g. tank:disk-0,vault:disk-1
      - CRON_SCHEDULE=30 2 * * 1  # Weekly on Monday at 2:30 AM
      - SCHEDULED_RSYNC_TIMEOUT=3600  # Seconds of rsync inactivity before a scheduled run drops a route; 0 disables. Manual runs have no timeout
      - SSH_KEY_FILE=id_rsa
      - TZ=Europe/Madrid
      - ROUTES_FILE=/backup_routes.json
    labels:
      - com.centurylinklabs.watchtower.enable=false
  
  # Test service for running tests in container
  rsync-backup-test:
    container_name: rsync-backup-test
    build:
      context: .
      dockerfile: build/Dockerfile
      target: testing
    volumes:
      # Mount source code for live development testing
      - ./src:/src
      - ./tests:/tests
      - ./pytest.ini:/pytest.ini
      - ./run_tests.sh:/run_tests.sh
      - ./requirements-test.txt:/requirements-test.txt
      # Create test logs directory
      - ./test-logs:/logs
    environment:
      - TZ=Europe/Madrid
      - PYTHONPATH=/src
    profiles:
      - testing
    command: ["/run_tests.sh", "help"]
    
networks:
  backup:
    ipam:
      config:
        - subnet: 192.168.6.0/24